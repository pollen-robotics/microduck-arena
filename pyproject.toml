[project]
name = "microduck-arena"
version = "0.7.0"
# One minor version, exactly. The golden run is measured on it, and it is the
# interpreter mjlab (through mujoco-warp) allows, so a microduck-challenges
# checkout can hold this package and mjlab-microduck in one environment.
requires-python = ">=3.12,<3.13"
dependencies = [
    # PINNED EXACTLY, and this is not fussiness. Every recorded time is a
    # measurement made by these three, and MuJoCo's solver changes between
    # minor versions: measured on the reference walker at the sprint's old
    # pinned command, 3.12.0 gives 18.2 s and 3.13.0 gives 44.9 s. The same
    # policy, the same course, the same code — it barely walks under 3.13.
    #
    # An unpinned range let a Docker build resolve 3.13 and produce a Space
    # whose leaderboard was silently incomparable with every other one.
    # RUNNER_VERSION says runs from different physics are never compared; it
    # cannot help if nothing notices the physics moved. arena/golden.py is what
    # notices, and these pins are what stop it happening in the first place.
    #
    # Moving any of these is a decision to re-baseline the golden run and bump
    # RUNNER_VERSION in the same commit.
    #
    # These three are what mjlab 1.3.0 / mujoco-warp 3.8.1 lock in microduck_rl;
    # moving them means moving with mjlab, so the challenges repo's uv.lock can
    # resolve both packages. Version 3 of the runner is that move.
    "mujoco==3.10.0",
    "onnxruntime==1.24.4",
    "numpy==2.4.1",
    # Not physics: these touch no recorded number, so they keep ranges.
    "huggingface-hub>=0.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "websockets>=13",  # The recorder's DevTools client (arena/recorder.py).
]

[project.optional-dependencies]
# onnx is only used by tests, to build deliberately malformed model fixtures.
# <1.23: onnx 1.23.0 writes IR version 14, which onnxruntime 1.24.4 (pinned
# above) cannot load — capped so the fixtures stay loadable, not out of caution.
dev = ["pytest>=8.0", "ruff>=0.6", "onnx>=1.16,<1.23", "httpx>=0.27"]

[project.scripts]
arena = "arena.cli:main"
# The challenge workshop, run inside a microduck-challenges checkout.
workshop = "arena.workshop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]
# The built site, copied in by scripts/bundle_frontend.py. Gitignored, so it
# has to be named here: hatchling drops ignored files unless they are artifacts.
artifacts = ["arena/frontend/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the Hugging Face Hub; skip with -m 'not network'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's File(...)/Form(...)/Depends(...) as argument defaults is the
# framework's documented idiom, not the mutable-default-argument bug B008
# looks for: FastAPI calls these once per request via its DI system, so
# nothing is shared across requests. Ruff's own docs recommend this exact
# allowlist for FastAPI code.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
