<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Microduck Arena</title>
    <link rel="icon" href="/duck-head-mark.webp" />
    <!-- The Arena's design system, on every page: the tokens, the effect
         primitives, the component inventory and the motion beats. Anton and
         DM Sans are self-hosted by tokens.css. -->
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="/design/effects.css" />
    <link rel="stylesheet" href="/design/components.css" />
    <link rel="stylesheet" href="/design/motion.css" />
    <!-- The shell every page wears: the strip over the door and the column
         under it, above whichever placement sheet the view wears. -->
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/guides.css" />
    <!-- The channel's stage, on every page: it is the whole window on the live
         page and a player framed beside the ladder on the front one. -->
    <link rel="stylesheet" href="/stage.css" />
    <!-- The round cards, on every page: the front page's wall deals them under
         the club's sheet and a race's strip of other rounds under the race's. -->
    <link rel="stylesheet" href="/cards.css" />
    <!-- What each view puts inside that column, enabled one at a time by
         main.js: the club for the home and player pages, the race for a race,
         the channel's own for the live page. All dress the same tokens; they
         are separate because a race page is a timing board that sets its own
         text density, and the channel is nothing but a stage. Static files on
         purpose — Vite would fold a src/ stylesheet into the bundle and drop
         the data-theme attribute the switch relies on. -->
    <!-- Fetched up front, though they start disabled. Chrome and Safari do not
         load a disabled stylesheet at all until it is enabled — so the first
         click into a race went and got 46 KB of race.css right then, and the
         page sat unstyled for a round trip while it came. Preloading puts
         them in the cache before anyone asks, and enabling is then instant.
         The same stamped URLs as the links below, so it is one cache entry
         each and not two. -->
    <link rel="preload" as="style" href="/race.css" />
    <link rel="preload" as="style" href="/live.css" />
    <link rel="stylesheet" href="/club.css" data-theme="club" />
    <link rel="stylesheet" href="/race.css" data-theme="race" disabled />
    <link rel="stylesheet" href="/live.css" data-theme="live" disabled />
    <!-- Halloween week, 2026: inert until halloween.js marks the page. -->
    <link rel="stylesheet" href="/halloween.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
